name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  linux-distros:
    name: test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            prepare: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl tar
          - distro: fedora:41
            prepare: dnf -y install git ca-certificates curl tar
          - distro: rockylinux:9
            prepare: dnf -y install --setopt=install_weak_deps=False git
          - distro: archlinux:latest
            prepare: pacman -Syu --noconfirm git ca-certificates curl tar
          - distro: alpine:3.20
            prepare: apk add --no-cache git ca-certificates curl tar
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Prepare environment
        run: ${{ matrix.prepare }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

  release:
    needs: linux-distros
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Run tests
        run: go test -v -race ./...

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
